services:
  postgres:
    image: postgres:18.1-bookworm
    container_name: rbac-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - /tmp/lab3-pgdata:/var/lib/postgresql
    networks:
      - rbac-network
    restart: always

networks:
  rbac-network:
    driver: bridge